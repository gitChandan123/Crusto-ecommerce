{% load static %}
<!DOCTYPE html>

<html lang="en">
<link rel="shortcut icon" href="{% static 'images/favicon.png' %}" />
  <head>
    <script src="{% static 'js/jquery-3.4.1.min.js' %}"></script>
    <script src="{% static 'js/bootstrap.js' %}"></script>
    <script src="{% static 'js/custom.js' %}"></script>
    <script src="{% static 'js/csrf_token.js' %}"></script>
  </head>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Failed</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body
    class="bg-light d-flex justify-content-center align-items-center"
    style="height: 100vh"
  >
    <div class="card text-center shadow-lg" style="max-width: 400px">
      <div class="card-body">
        <h1 class="text-danger mb-4"><i class="bi bi-x-circle"></i></h1>
        <h4 class="card-title text-danger">Payment Failed</h4>
        <p class="card-text">
          We're sorry, but your payment could not be processed. Please try
          again.
        </p>
        <a
          href="{% url 'create_checkout_session' %}"
          class="btn btn-primary mt-3"
          >Retry Payment</a
        >
      </div>
    </div>

    <!-- Bootstrap JS and Icons -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.js"></script>
  </body>
</html>
