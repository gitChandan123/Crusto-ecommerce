{% extends 'base.html' %}
{% load static %}
<script src="{% static 'js/login_model.js' %}%}"></script>
<script src="{% static 'js/jquery-3.4.1.min.js' %}"></script>
      <script src="{% static 'js/bootstrap.js' %}"></script>
      <script src="{% static 'js/custom.js' %}"></script>
{% block main %}
<!-- Login Modal -->
<div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="loginModalLabel">Login</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form method="POST" action="{% url 'User_Login' %}">
          {% csrf_token %}
          <input type="hidden" id="next" name="next" value="{{ request.GET.next|default:'' }}">

          {% if message %}
            <div class="alert alert-danger" role="alert">
              {{ message }}
            </div>
          {% endif %}

          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary">Login</button>
          </div>
          <p class="mt-3">
            Don't have an account? <a href="{% url 'User_Register' %}">Register</a>
          </p>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS and CSS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- JavaScript to trigger modal automatically based on URL -->
<script src="{% static 'js/login_model.js' %}"></script>
{% endblock %}
