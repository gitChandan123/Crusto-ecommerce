{% extends 'base.html' %}
{% load static %}
<script src="{% static 'js/jquery-3.4.1.min.js' %}"></script>
      <script src="{% static 'js/bootstrap.js' %}"></script>
      <script src="{% static 'js/custom.js' %}"></script>
{% block main %}
<!-- Register Modal -->
<div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="registerModalLabel">Register</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <!-- Registration Form -->
        <form method="POST" action="{% url 'User_Register' %}">
          <input type="hidden" id="next" name="next" value="{{ request.GET.next|default:'' }}">
          {% csrf_token %}

          <!-- Render form fields with Bootstrap styles -->
          {% for field in form %}
            <div class="mb-3">
              <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
              {{ field }}
              {% if field.errors %}
                <div class="text-danger">
                  {{ field.errors|striptags }}
                </div>
              {% endif %}
            </div>
          {% endfor %}

          <!-- Submit Button -->
          <div class="d-grid">
            <button type="submit" class="btn btn-primary">Register</button>
          </div>

          <!-- Login Link -->
          <p class="mt-3">
            Already have an account? <a href="{% url 'User_Login' %}">Login</a>
          </p>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS and CSS (required for Modal) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- JavaScript to trigger modal automatically based on URL -->
<script>
  window.onload = function () {
    const currentUrl = window.location.href;

    // List of URLs to trigger the register modal
    const registerTriggerUrls = ['/register/'];

    // Check if the URL matches, and show the modal if it does
    if (registerTriggerUrls.some((url) => currentUrl.includes(url))) {
      const registerModal = new bootstrap.Modal(document.getElementById('registerModal'));
      registerModal.show();
    }
  };
</script>
{% endblock %}
