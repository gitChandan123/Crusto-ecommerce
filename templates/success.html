<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
      <script src="{% static 'js/jquery-3.4.1.min.js' %}"></script>
      <script src="{% static 'js/bootstrap.js' %}"></script>
      <script src="{% static 'js/custom.js' %}"></script>
      <link rel="shortcut icon" href="{% static 'images/favicon.png' %}" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center" style="height: 100vh;">

    <div class="card text-center shadow-lg" style="max-width: 400px;">
        <div class="card-body">
            <h1 class="text-success mb-4"><i class="bi bi-check-circle"></i></h1>
            <h4 class="card-title text-success">Payment Successful</h4>
            <p class="card-text">Thank you! Your payment has been processed successfully.</p>
            <a href={% url 'Home' %} class="btn btn-primary mt-3">Go to Dashboard</a>
        </div>
    </div>

    <!-- Bootstrap JS and Icons -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.js"></script>
</body>
</html>
